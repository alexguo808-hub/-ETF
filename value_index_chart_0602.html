    }
    
    function findIndex(date) {
        for (var i = 0; i < dates.length; i++) {
            if (new Date(dates[i]) >= date) {
                return i;
            }
        }
        return dates.length - 1;
    }
    
    function calcRange(dataObj, startIdx, endIdx) {
        var minVal = Infinity;
        var maxVal = -Infinity;
        var hasValid = false;
        
        for (var key in dataObj) {
            if (!dataObj.hasOwnProperty(key)) continue;
            var arr = dataObj[key];
            for (var i = startIdx; i <= endIdx && i < arr.length; i++) {
                var v = arr[i];
                if (v !== null && v !== undefined && !isNaN(v)) {
                    if (v < minVal) minVal = v;
                    if (v > maxVal) maxVal = v;
                    hasValid = true;
                }
            }
        }
        
        if (!hasValid) return null;
        
        var margin = (maxVal - minVal) * 0.1;
        if (margin === 0 || isNaN(margin)) margin = Math.abs(maxVal) * 0.1 || 1;
        return [minVal - margin, maxVal + margin];
    }
    
    function updateYAxisRange() {
        if (isUpdating) return;
        
        var range = getVisibleRange();
        if (!range) return;
        
        var startIdx = findIndex(range.start);
        var endIdx = findIndex(range.end);
        
        if (endIdx <= startIdx) endIdx = startIdx + 1;
        if (endIdx >= dates.length) endIdx = dates.length - 1;
        
        var leftRange = calcRange(leftData, startIdx, endIdx);
        var rightRange = calcRange(rightData, startIdx, endIdx);
        
        var updates = {};
        if (leftRange) {
            updates['yaxis.range'] = leftRange;
        }
        if (rightRange) {
            updates['yaxis2.range'] = rightRange;
        }
        
        if (Object.keys(updates).length > 0) {
            isUpdating = true;
            Plotly.relayout(plotlyDiv, updates).then(function() {
                isUpdating = false;
            });
        }
    }
    
    function debouncedUpdate() {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(updateYAxisRange, 100);
    }
    
    plotlyDiv.on('plotly_relayout', function(eventData) {
        if (!eventData) return;
        
        var hasXChange = (
            eventData['xaxis.range'] !== undefined || 
            eventData['xaxis.range[0]'] !== undefined || 
            eventData['xaxis.range[1]'] !== undefined ||
            eventData['xaxis.autorange'] !== undefined
        );
        
        if (hasXChange) {
            debouncedUpdate();
        }
    });
    
    setTimeout(updateYAxisRange, 300);
})();
</script>
